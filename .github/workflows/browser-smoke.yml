name: Browser integration smoke tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Compile static site with MOCK EmailJS IDs and known GA4 measurement ID
        env:
          NEXT_PUBLIC_BASE_PATH: /pitotshield
          NEXT_PUBLIC_ASSET_PREFIX: /pitotshield
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: test-service
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: test-template
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: test-public
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-GH3FLHMFLH
        run: npm run build
      - name: Verify all original product documents and MP4s
        run: npm run test:assets
      - name: Host static export under Pages base path
        run: |
          mkdir -p preview-root/pitotshield
          cp -a out/. preview-root/pitotshield/
          python3 -m http.server 4173 --directory preview-root > /tmp/preview-server.log 2>&1 &
          echo $! > /tmp/preview-server.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/pitotshield/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview-server.log
          exit 1
      - name: Check real browser rendering and mocked lead/analytics events
        run: npm run test:browser
