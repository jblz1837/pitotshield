name: Build and review Next.js

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Static export build
        env:
          NEXT_PUBLIC_BASE_PATH: /pitotshield
          NEXT_PUBLIC_ASSET_PREFIX: /pitotshield
        run: npm run build
      - name: Verify output
        run: test -f out/index.html
      - name: Upload build for review
        uses: actions/upload-artifact@v4
        with:
          name: pitotshield-static-review
          path: out
          retention-days: 7
