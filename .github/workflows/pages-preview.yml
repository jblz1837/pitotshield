name: Publish APPROVED preview — select MAIN to run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/preview-trigger.txt"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pitotshield-review-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require main dispatch for GitHub Pages environment
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Run this workflow from main. It explicitly checks out the approved redesign branch." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-approved-redesign
      - name: Confirm approved redesign checkout
        run: |
          test "$(git branch --show-current)" = "feature/complete-approved-redesign"
          echo "Building approved branch: $(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
      - name: Build static preview
        env:
          NEXT_PUBLIC_BASE_PATH: /pitotshield
          NEXT_PUBLIC_ASSET_PREFIX: /pitotshield
          NEXT_PUBLIC_SITE_URL: https://jblz1837.github.io/pitotshield
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ""
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
