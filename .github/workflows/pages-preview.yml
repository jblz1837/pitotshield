name: Validate approved preview (build only; never deploy to production Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/preview-trigger.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-approved-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build preview-only artifact
        env:
          NEXT_PUBLIC_BASE_PATH: /pitotshield
          NEXT_PUBLIC_ASSET_PREFIX: /pitotshield
          NEXT_PUBLIC_SITE_URL: https://jblz1837.github.io/pitotshield
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ""
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: service_dw49i0o
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: template_gi9vc8l
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: 9aF0aO99oDFlU0X9H
        run: npm run build
      - name: Verify preview files
        run: npm run test:assets
      - name: Keep preview package as a workflow artifact only (do not deploy)
        uses: actions/upload-artifact@v4
        with:
          name: approved-preview-build-only
          path: out
          retention-days: 7
