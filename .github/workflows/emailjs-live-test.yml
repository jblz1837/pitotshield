name: Verify EmailJS live configuration and send one labeled QA inquiry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/emailjs-test-trigger.txt"
permissions:
  contents: read
jobs:
  emailjs-test:
    runs-on: ubuntu-latest
    env:
      EMAILJS_SERVICE: service_dw49i0o
      EMAILJS_TEMPLATE: template_ifsa9jp
      EMAILJS_PUBLIC: PJp-Gm6ZhIgKkvlLu
    steps:
      - name: Check presence of all three EmailJS identifiers without exposing values
        id: config
        shell: bash
        run: |
          missing=0
          if [ -z "$EMAILJS_SERVICE" ]; then echo "MISSING: PITOTSHIELD_EMAILJS_SERVICE_ID"; missing=1; else echo "FOUND: PITOTSHIELD_EMAILJS_SERVICE_ID"; fi
          if [ -z "$EMAILJS_TEMPLATE" ]; then echo "MISSING: PITOTSHIELD_EMAILJS_TEMPLATE_ID"; missing=1; else echo "FOUND: PITOTSHIELD_EMAILJS_TEMPLATE_ID"; fi
          if [ -z "$EMAILJS_PUBLIC" ]; then echo "MISSING: PITOTSHIELD_EMAILJS_PUBLIC_KEY"; missing=1; else echo "FOUND: PITOTSHIELD_EMAILJS_PUBLIC_KEY"; fi
          if [ "$EMAILJS_SERVICE" = "PITOTSHIELD_EMAILJS_SERVICE_ID" ]; then echo "::error::The service ID value is the variable NAME. Replace the value with the actual EmailJS service ID."; missing=1; fi
          if [ "$EMAILJS_TEMPLATE" = "PITOTSHIELD_EMAILJS_TEMPLATE_ID" ]; then echo "::error::The template ID value is the variable NAME. Replace the value with the actual EmailJS template ID."; missing=1; fi
          if [ "$EMAILJS_PUBLIC" = "PITOTSHIELD_EMAILJS_PUBLIC_KEY" ]; then echo "::error::The public key value is the variable NAME. Replace the value with the actual EmailJS public key."; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::EmailJS configuration missing. Save variables or secrets under this repository's Actions settings."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Send one clearly identified real contact-form test
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          payload={
            "service_id":os.environ["EMAILJS_SERVICE"],
            "template_id":os.environ["EMAILJS_TEMPLATE"],
            "user_id":os.environ["EMAILJS_PUBLIC"],
            "template_params":{
              "from_name":"DeGroff Website QA Test",
              "from_email":"jrussell@degroffaviation.com",
              "reply_to":"jrussell@degroffaviation.com",
              "company":"DeGroff Aviation Technologies QA",
              "aircraft":"TEST ONLY",
              "interest":"TEST ONLY - Website Contact Form Verification",
              "message":"DEGROFF-WEBSITE-QA-20261118. This is a single test of the new website contact form integration. No sales inquiry; please disregard. Verify this arrived at the expected inbox and Reply-To is correct."
            }
          }
          request=urllib.request.Request("https://api.emailjs.com/api/v1.0/email/send",data=json.dumps(payload).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          try:
            with urllib.request.urlopen(request,timeout=25) as response:
              data=response.read().decode("utf-8",errors="replace")
              print("EmailJS accepted test request; HTTP status:",response.status,"response:",data[:200])
          except urllib.error.HTTPError as exc:
            print("EmailJS rejected test request; HTTP status:",exc.code)
            print("EmailJS error response:",exc.read().decode("utf-8",errors="replace")[:500])
            raise SystemExit(1)
          PY
